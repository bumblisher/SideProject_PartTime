<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="resource/css/reset.css">
    <link rel="stylesheet" href="resource/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script src="resource/js/jquery-3.4.1.min.js"></script>
    <script src="resource/js/main.js"></script>
    <title>Mcare</title>
</head>

<body>
    <div class="wrap">
        <header class="header sub tab">
            <div class="header_inner">
                <div class="left">
                    <button class="btn_back"></button>
                </div>
                <h2>포인트 사용내역</h2>
                <div class="right">
                </div>
            </div>
        </header>
        <main>
            <div class="mypoint_box">
                <p>내 포인트</p>
                <p class="point">300 P</p>
            </div>
            <div class="grp_select_sch">
                <span>조회기간</span><button class="btn_select" id="openSheetBtn">1개월</button>
            </div>
            <ul class="list_point"></ul>
            <div class="list_point_empty">
                <p class="tit">포인트 사용 내역이 없습니다.</p>
            </div>
        </main>
        <div class="sheet-backdrop" id="sheetBackdrop"></div>
        <div class="bottom-sheet" id="bottomSheet">
            <p class="txt">오늘 기준으로 1년까지 조회가 가능합니다.</p>
            <ul class="sheet-list">
                <li class="sheet-item">1개월</li>
                <li class="sheet-item">3개월</li>
                <li class="sheet-item">1년</li>
            </ul>
        </div>
    </div>
</body>

</html>
