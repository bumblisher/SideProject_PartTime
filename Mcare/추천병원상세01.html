<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">
    <link rel="stylesheet" href="resource/css/reset.css">
    <link rel="stylesheet" href="resource/css/common.css">
    <script src="resource/js/jquery-3.4.1.min.js"></script>
    <script src="resource/js/main.js"></script>
    <title>Mcare</title>
</head>

<body>
    <div class="wrap">
        <header class="header sub">
            <div class="header_inner">
                <div class="left">
                    <button class="btn_back"></button>
                </div>
                <h2>르샤인 의원</h2>
                <div class="right">
                </div>
            </div>
        </header>
        <main>
            <div class="imgtop_detail">
                <div class="img">
                    <img src="resource/images/img_hospital01.png" alt="">
                </div>
                <div class="top">
                    <p class="tit">르샤인 의원</p>
                    <a href="#">홈페이지</a>
                </div>
                <p class="call">02-6677-2533</p>
            </div>
            <div class="bar"></div>
            <dl class="dl_info">
                <dt>병원소개</dt>
                <dd>해부학과 생리학적 지식을 갖춘 도수치료사의 체계적인 치료로 근본적인 통증의 원인을 해결합니다.<br>
                    정성스럽게 진료하겠습니다.</dd>
                <dt>진료과목</dt>
                <dd>정형외과, 도수치료, 물리치료, 관절내시경 등</dd>
            </dl>
            <div class="bar"></div>
            <div class="formbox">
                <p class="badge_time">빠른 방문 예약</p>
                <div class="grp_form">
                    <p class="tit req">신청자 성명</p>
                    <div class="cont">
                        <input type="text" placeholder="성명을 입력해 주세요.">
                        <p class="txt_err">성명을 입력해주세요.</p>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit req">연락처</p>
                    <div class="cont">
                        <input type="text" placeholder="휴대폰번호를 입력해 주세요.">
                        <p class="txt_err">휴대폰번호를 입력해 주세요.</p>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit req">방문 희망 시간</p>
                    <div class="cont">
                        <div class="grp_check mt12">
                            <input type="checkbox" name="check01" id="check01">
                            <label for="check01" class="fw_n">오전 10시 ~ 오후 2시 사이</label>
                        </div>
                        <div class="grp_check">
                            <input type="checkbox" name="check02" id="check02">
                            <label for="check02" class="fw_n">오후 2시 ~ 오후 4시 사이</label>
                        </div>
                        <div class="grp_check">
                            <input type="checkbox" name="check03" id="check03">
                            <label for="check03" class="fw_n">오후 6시 이후</label>
                        </div>
                    </div>
                </div>
                <div class="grp_form">
                    <div class="cont">
                        <div class="grp_check">
                            <input type="checkbox" name="check04" id="check04">
                            <label for="check04">개인정보 수집·이용 동의</label>
                            <a href="#">자세히보기</a>
                        </div>
                    </div>
                </div>
                <div class="grp_form">
                    <div class="cont">
                        <div class="notibox">
                            <p>상담예약 완료 후 상담사가 연락드립니다.</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="grp_bot">
                <p class="txt">영업일 기준 1~2일 이내 전화드립니다.</p>
                <button class="btn_bot">방문 예약하기</button>
            </div>
        </main>
    </div>
</body>

</html>
