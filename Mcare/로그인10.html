<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">
    <link rel="stylesheet" href="resource/css/reset.css">
    <link rel="stylesheet" href="resource/css/common.css">
    <script src="resource/js/jquery-3.4.1.min.js"></script>
    <script src="resource/js/main.js"></script>
    <title>Mcare</title>
</head>

<body>
    <div class="wrap">
        <header class="header sub">
            <div class="header_inner">
                <div class="left"></div>
                <h2>로그인</h2>
                <div class="right">
                    <button class="btn_close"></button>
                </div>
            </div>
        </header>
        <main>
            <div class="formbox" style="margin-top: 80px">
                <div class="grp_form">
                    <p class="tit">휴대폰 번호</p>
                    <div class="cont">
                        <input type="text" placeholder="휴대폰 번호 8자리를 입력해 주세요" value="01012345678">
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit">비밀번호</p>
                    <div class="cont">
                        <input type="password" placeholder="카카오톡으로 받은 비밀번호를 입력해주세요" value="45622">
                    </div>
                </div>
                <div class="grp_form">
                    <div class="cont">
                        <div class="grp_check">
                            <input type="checkbox" name="check01" id="check01" checked>
                            <label for="check01">로그인상태 유지</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="grp_bot">
                <button class="btn_bot">휴대폰 번호로 로그인</button>
                <p class="sub_txt">회원 인증하셨나요? <a href="#">인증하기</a></p>
            </div>
        </main>
    </div>
</body>

</html>
