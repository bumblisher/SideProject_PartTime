<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">
    <link rel="stylesheet" href="resource/css/reset.css">
    <link rel="stylesheet" href="resource/css/common.css">
    <script src="resource/js/jquery-3.4.1.min.js"></script>
    <script src="resource/js/main.js"></script>
    <title>Mcare</title>
</head>

<body>
    <div class="wrap">
        <header class="header sub">
            <div class="header_inner">
                <div class="left">
                </div>
                <h2>신청 내역 상세</h2>
                <div class="right">
                    <button class="btn_close"></button>
                </div>
            </div>
        </header>
        <main>
            <div class="imgtop_detail">
                <div class="top">
                    <p class="tit">KB 손해보험 다이렉트 상담 예약</p>
                </div>
                <div class="counsel_detail">
                    <span>상담 진행 상태</span>
                    <span class="badge complate">상담완료</span>
                </div>
            </div>
            <div class="bar"></div>
            <dl class="dl_info">
                <dt>상담 신청 내용</dt>
                <dd>
                    <ul>
                        <li>
                            <span class="year">신청자 성명</span>
                            <span>홍길동</span>
                        </li>
                        <li>
                            <span class="year">연락처</span>
                            <span>010-1234-5678</span>
                        </li>
                        <li>
                            <span class="year">상담 희망 시간</span>
                            <span>오전 10시 ~ 오후 2시 사이</span>
                        </li>
                        <li>
                            <span class="year">상담 희망 항목</span>
                            <span>실손보험 점검</span>
                        </li>
                    </ul>
                </dd>
            </dl>
            <div class="box_card">
                <p class="title">배정된 담당자</p>
                <div class="list_card">
                    <img src="resource/images/img_card.png" alt="">
                    <ul>
                        <li>
                            <span class="tit">성명</span>
                            <span class="txt">김기영</span>
                        </li>
                        <li>
                            <span class="tit">직책</span>
                            <span class="txt">지점장</span>
                        </li>
                        <li>
                            <span class="tit">연락처</span>
                            <span class="txt">010-2222-2222</span>
                        </li>
                        <li>
                            <span class="tit">대리점명</span>
                            <span class="txt">펫프로 송도점</span>
                        </li>
                    </ul>
                </div>
                <ul>
                    <li>
                        <span class="tit">보험 판매코드</span>
                        <span class="txt">삼성화재 00000000</span>
                    </li>
                </ul>
            </div>
            <div class="grp_bot">
                <button class="btn_bot">확인</button>
            </div>
        </main>
    </div>
</body>

</html>
