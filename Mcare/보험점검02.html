<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">
    <link rel="stylesheet" href="resource/css/reset.css">
    <link rel="stylesheet" href="resource/css/common.css">
    <script src="resource/js/jquery-3.4.1.min.js"></script>
    <script src="resource/js/main.js"></script>
    <title>Mcare</title>
</head>

<body>
    <div class="wrap">
        <header class="header sub">
            <div class="header_inner">
                <div class="left">
                </div>
                <h2>상담 예약</h2>
                <div class="right">
                    <button class="btn_close"></button>
                </div>
            </div>
        </header>
        <main>
            <div class="formbox">
                <p class="badge_time">빠른 상담 예약</p>
                <div class="grp_form">
                    <p class="tit req">신청자 성명</p>
                    <div class="cont">
                        <input type="text" placeholder="성명을 입력해 주세요.">
                        <p class="txt_err">성명을 입력해주세요.</p>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit req">연락처</p>
                    <div class="cont">
                        <input type="text" placeholder="휴대폰번호를 입력해 주세요.">
                        <p class="txt_err">휴대폰번호를 입력해 주세요.</p>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit req">상담 희망 시간</p>
                    <div class="cont">
                        <div class="grp_check mt12">
                            <input type="checkbox" name="check01" id="check01">
                            <label for="check01" class="fw_n">오전 10시 ~ 오후 2시 사이</label>
                        </div>
                        <div class="grp_check">
                            <input type="checkbox" name="check02" id="check02">
                            <label for="check02" class="fw_n">오후 2시 ~ 오후 4시 사이</label>
                        </div>
                        <div class="grp_check">
                            <input type="checkbox" name="check03" id="check03">
                            <label for="check03" class="fw_n">오후 6시 이후</label>
                        </div>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit req">상담 희망 항목</p>
                    <div class="cont">
                        <div class="grp_check mt12">
                            <input type="checkbox" name="check04" id="check04">
                            <label for="check04" class="fw_n">실손보험 점검</label>
                        </div>
                        <div class="grp_check">
                            <input type="checkbox" name="check05" id="check05">
                            <label for="check05" class="fw_n">중복보험 확인</label>
                        </div>
                        <div class="grp_check">
                            <input type="checkbox" name="check06" id="check06">
                            <label for="check06" class="fw_n">암보험 상담</label>
                        </div>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit">추가메모 (선택)</p>
                    <div class="cont">
                        <textarea type="text" placeholder="ex.  상세한 상담 부탁드립니다."></textarea>
                    </div>
                </div>
                <div class="grp_form">
                    <div class="cont">
                        <div class="grp_check">
                            <input type="checkbox" name="check" id="check">
                            <label for="check">개인정보 수집·이용 동의</label>
                            <a href="#">자세히보기</a>
                        </div>
                    </div>
                </div>
                <div class="grp_form">
                    <div class="cont">
                        <div class="notibox">
                            <p>상담예약 완료 후 해당 지역 파트너<br>
                                손해사정사가 연락드립니다.</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="grp_bot">
                <p class="txt">영업일 기준 1~2일 이내 전화드립니다.</p>
                <button class="btn_bot">상담 예약하기</button>
            </div>
        </main>
    </div>
</body>

</html>
