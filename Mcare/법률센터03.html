<!DOCTYPE html>
<html lang="ko">

<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />

    <div class="wrap">
        <div class="swiper tabmenu tabonly">
            <ul class="swiper-wrapper">

            <div class="main_banner-pagination"></div>
            <!-- Initialize Swiper -->
            <script>
                var swiper = new Swiper(".tabmenu", {

        </div>
        <main>
            <div class="topbox lawfirm">
                <img src="resource/images/logo_lawfirm.svg" alt="">
                <p class="tit">최고의 법률전문가와 <br>

            </div>
            <div class="imgtop_detail">
                <div class="top">

                <p class="tit">소속 변호사 <span class="pt">N명</span></p>
            </div>
            <dl class="dl_info">
                <dt>병원소개</dt>
                <dd>튼튼정형외과는 친절한 서비스를 제공하며
                    믿을 수 있고 상세한 진료로 환자분들의 빠른 쾌유를
                    기원합니다.</dd>
                <dt>진료과목</dt>
                <dd>정형외과, 도수치료 등</dd>
            </dl>
        </main>
        <nav>
            <ul class="gnb">
                <li><a href="#">홈</a></li>
                <li class="on"><a href="#">법률센터</a></li>
                <li><a href="#">보상센터</a></li>
                <li><a href="#">공짜사은품</a></li>
