<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">
    <link rel="stylesheet" href="resource/css/reset.css">
    <link rel="stylesheet" href="resource/css/common.css">
    <script src="resource/js/jquery-3.4.1.min.js"></script>
    <script src="resource/js/main.js"></script>
    <title>Mcare</title>
</head>

<body>
    <div class="wrap">
        <header class="header sub">
            <div class="header_inner">
                <div class="left">
                    <button class="btn_back"></button>
                </div>
                <div class="right">
                </div>
            </div>
        </header>
        <main>
            <div class="img_compbox">
                <img src="resource/images/img_login_comp.svg" alt="">
                <p class="tit">보험 가입자 홍길동 님<br>
                    환영합니다. </p>
                <p class="tit_sub">회원인증 절차가 완료되었습니다.</p>
                <p class="txt">새로 사용하실 비밀번호를 입력해주세요</p>
            </div>
            <div class="formbox">
                <div class="grp_form">
                    <p class="tit">비밀번호 입력</p>
                    <div class="cont">
                        <input type="password" placeholder="숫자, 영문, 특수문자 포함 최소 8자 이상">
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit">비밀번호 확인</p>
                    <div class="cont">
                        <input type="password" placeholder="다시 한번 입력해 주세요">
                    </div>
                </div>
            </div>
            <div class="grp_bot">
                <button class="btn_bot" disabled>확인</button>
            </div>
        </main>
    </div>
</body>

</html>
