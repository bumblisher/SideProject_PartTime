<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">
    <link rel="stylesheet" href="resource/css/reset.css">
    <link rel="stylesheet" href="resource/css/common.css">
    <script src="resource/js/jquery-3.4.1.min.js"></script>
    <script src="resource/js/main.js"></script>
    <title>Mcare</title>
</head>

<body>
    <div class="wrap">
        <header class="header sub">
            <div class="header_inner">
                <div class="left"></div>
                <h2>회원 인증</h2>
                <div class="right">
                    <button class="btn_close"></button>
                </div>
            </div>
        </header>
        <main>
            <p class="join_tit">보험 기가입자를 위한 회원인증</p>
            <div class="formbox">
                <div class="grp_form">
                    <p class="tit">성명</p>
                    <div class="cont">
                        <input type="text" placeholder="성명을 입력해 주세요">
                        <p class="txt_err">회원 정보를 확인해 주세요.</p>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit">휴대폰 번호</p>
                    <div class="cont">
                        <input type="text" placeholder="휴대폰번호를 입력해 주세요">
                        <p class="txt_err">회원 정보를 확인해 주세요.</p>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit">임시 비밀번호</p>
                    <div class="cont">
                        <input type="text" placeholder="카카오톡으로 받은 비밀번호를 입력해주세요">
                        <p class="txt_err">카카오톡에서 임시 비밀번호를 확인해 주세요.</p>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit">회원 인증번호</p>
                    <div class="cont">
                        <input type="text" placeholder="카카오톡으로 받은 인증번호를 입력해주세요">
                        <p class="txt_err">발송된 인증번호를 확인해 주세요.</p>
                    </div>
                </div>
            </div>
            <div class="grp_bot">
                <button class="btn_bot" disabled>회원 인증하기</button>
            </div>
        </main>
    </div>
</body>

</html>
