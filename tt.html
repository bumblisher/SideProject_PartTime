<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul class="tab-menu">
        <li class="active">교통사고</li>
        <li>부동산</li>
        <li>가정법 및 이혼</li>
        <li>계약 및 상업적 분쟁</li>
        <li>노동관련 분쟁</li>
        <li>소비자 관련 분쟁</li>
    </ul>
    <div class="tab-content">
        <div style="display:block;">교통사고 관련 내용</div>
        <div>부동산 관련 내용</div>
        <div>가정법 및 이혼 관련 내용</div>
        <div>계약 및 상업적 분쟁 관련 내용</div>
        <div>노동관련 분쟁 관련 내용</div>
        <div>소비자 관련 분쟁 내용</div>
    </div>
    <script>
        const tabMenu = document.querySelectorAll('.tab-menu li');
        const tabContent = document.querySelectorAll('.tab-content > div');
        tabMenu.forEach((tab, idx) => {
            tab.addEventListener('click', function () {
                tabMenu.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                tabContent.forEach((c, i) => c.style.display = i === idx ? 'block' : 'none');
            });
        });
    </script>
    <style>
        .tab-menu {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 8px;
        }

        .tab-menu li {
            padding: 8px 16px;
            background: #f5f7fa;
            border-radius: 12px;
            cursor: pointer;
            color: #888;
        }

        .tab-menu li.active {
            background: #23232b;
            color: #fff;
            font-weight: bold;
        }

        .tab-content>div {
            display: none;
            margin-top: 16px;
        }

        .tab-content>div:first-child {
            display: block;
        }
    </style>

</body>

</html>
