<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="resource/css/reset.css">
    <link rel="stylesheet" href="resource/css/common.css">
    <script src="resource/js/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script src="resource/js/main.js"></script>
    <title>momplan</title>
</head>
<body>
    <div class="wrap">
        <header class="header sub">
            <div class="header_inner">
                <button class="btn_close"></button>
                <h2>로그인</h2>
                <div class="right"></div>
            </div>
        </header>
        <main>
            <div class="formbox type2">
                <div class="grp_form">
                    <p class="tit">휴대폰 번호</p>
                    <div class="cont">
                        <input type="text" placeholder="-없이 숫자만 입력하세요">
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit">비밀번호</p>
                    <div class="cont">
                        <input type="text" placeholder="비밀번호를 입력하세요">
                    </div>
                </div>
                <div class="grp_form">
                    <div class="cont">
                        <div class="grp_check">
                            <input type="checkbox" name="check01" id="check01">
                            <label for="check01">로그인상태 유지</label>
                        </div>
                    </div>
                </div>
                <button class="btn_form">휴대폰 번호로 로그인</button>
                <div class="grp_sublink">
                    <span>처음 방문하셨나요?</span>
                    <a href="#">회원가입</a>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
