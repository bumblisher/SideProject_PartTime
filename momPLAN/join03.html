<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="resource/css/reset.css">
    <link rel="stylesheet" href="resource/css/common.css">
    <script src="resource/js/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script src="resource/js/main.js"></script>
    <title>momplan</title>
</head>

<body>
    <div class="wrap">
        <header class="header sub">
            <div class="header_inner">
                <a href="#" class="btn_back"></a>
                <div class="right"></div>
            </div>
        </header>
        <main>
            <p class="join_tit">추가정보 입력</p>
            <div class="formbox type2">
                <div class="grp_form">
                    <p class="tit">생년월일</p>
                    <div class="cont">
                        <input type="text" placeholder="생년월일 8자리를 입력해주세요">
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit">성별</p>
                    <div class="cont">
                        <ul class="grp_radio">
                            <li>
                                <input type="radio" name="radio01" id="radio01" checked>
                                <label for="radio01">여성</label>
                            </li>
                            <li>
                                <input type="radio" name="radio01" id="radio02">
                                <label for="radio02">남성</label>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit">실손보험 가입여부</p>
                    <div class="cont">
                        <ul class="grp_radio">
                            <li>
                                <input type="radio" name="radio02" id="radio03" checked>
                                <label for="radio03">가입</label>
                            </li>
                            <li>
                                <input type="radio" name="radio02" id="radio04">
                                <label for="radio04">미가입</label>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit">관심사</p>
                    <div class="cont">
                        <ul class="grp_radio">
                            <li>
                                <input type="radio" name="radio03" id="radio05" checked>
                                <label for="radio05">보험청구</label>
                            </li>
                            <li>
                                <input type="radio" name="radio03" id="radio06">
                                <label for="radio06">손해사정사 문의</label>
                            </li>
                            <li>
                                <input type="radio" name="radio03" id="radio07">
                                <label for="radio07">보험비교</label>
                            </li>
                            <li>
                                <input type="radio" name="radio03" id="radio08">
                                <label for="radio08">펫보험</label>
                            </li>
                        </ul>
                    </div>
                </div>
                <button class="btn_form" style="margin-top: 50px;">다음</button>
                <div class="grp_sublink" style="margin-top: 15px;">
                    <a href="#">건너뛰기</a>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
