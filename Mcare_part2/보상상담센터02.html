<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">
    <link rel="stylesheet" href="resource/css/reset.css">
    <link rel="stylesheet" href="resource/css/common.css">
    <script src="resource/js/jquery-3.4.1.min.js"></script>
    <script src="resource/js/main.js"></script>
    <title>Mcare</title>
</head>

<body>
    <div class="wrap">
        <header class="header sub">
            <div class="header_inner">
                <div class="left">
                </div>
                <h2>{홈 메뉴버튼명} 상담 예약</h2>
                <div class="right">
                    <button class="btn_close"></button>
                </div>
            </div>
        </header>
        <main>
            <div class="formbox">
                <p class="badge_time">빠른 상담 예약</p>
                <div class="grp_form">
                    <p class="tit req">신청자 성명</p>
                    <div class="cont">
                        <input type="text" placeholder="성명을 입력해 주세요.">
                        <p class="txt_err">성명을 입력해주세요.</p>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit req">연락처</p>
                    <div class="cont">
                        <input type="text" placeholder="휴대폰번호를 입력해 주세요.">
                        <p class="txt_err">휴대폰번호를 입력해 주세요.</p>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit req">가입 보험사</p>
                    <div class="cont">
                        <input type="text" placeholder="가입하신 보험사명을 입력해 주세요.">
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit req">지역</p>
                    <div class="cont">
                        <div class="flexbox">
                            <select name="" id="">
                                <option value="">시</option>
                            </select>
                            <select name="" id="">
                                <option value="">구</option>
                            </select>
                        </div>
                        <p class="txt_err">지역을 선택해주세요. </p>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit req">치료영수증</p>
                    <div class="cont">
                        <button class="btn_upload">사진 첨부</button>
                        <ul class="list_file">
                            <li><img src="resource/images/img_file.png" alt="">
                                <button class="btn_del"></button></li>
                            <li><img src="resource/images/img_file.png" alt="">
                                <button class="btn_del"></button></li>
                            <li><img src="resource/images/img_file.png" alt="">
                                <button class="btn_del"></button></li>
                            <li><img src="resource/images/img_file.png" alt="">
                                <button class="btn_del"></button></li>
                        </ul>
                        <p class="txt_sub">병원에서 발급받은 진료비 및 처방전 영수증을
                            첨부해 주세요</p>
                        <p class="txt_err">치료영수증을 첨부해주세요. </p>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit req">진단서</p>
                    <div class="cont">
                        <button class="btn_upload">사진 첨부</button>
                        <p class="txt_sub">담당 의사가 발급한 질병명과 치료 내용이 기재된
                            진단서를 첨부해 주세요. </p>
                        <p class="txt_err">진단서를 첨부해주세요. </p>
                    </div>
                </div>
                <div class="grp_form">
                    <p class="tit req">문의사항</p>
                    <div class="cont">
                        <textarea type="text" placeholder="문의사항을 입력해주세요."></textarea>
                    </div>
                </div>
                <div class="grp_form">
                    <div class="cont">
                        <div class="grp_check">
                            <input type="checkbox" name="check01" id="check01">
                            <label for="check01">개인정보 수집·이용 동의</label>
                            <a href="#">자세히보기</a>
                        </div>
                    </div>
                </div>
                <div class="grp_form">
                    <div class="cont">
                        <div class="notibox">
                            <p>상담예약 완료 후 해당 지역 파트너 
                                손해사정사가 연락드립니다.</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="grp_bot">
                <p class="txt">영업일 기준 1~2일 이내 전화드립니다.</p>
                <button class="btn_bot">상담 예약하기</button>
            </div>
        </main>
    </div>
</body>

</html>
